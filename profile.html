<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Profile • WC Matrimony</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<style>

body{
background:#f7f2e8;
font-family:"Work Sans",sans-serif;
margin:0;
}

.profile-page{
max-width:850px;
margin:40px auto;
padding:20px;
}

.profile-card{
background:white;
border-radius:22px;
overflow:hidden;
border:1px solid #e8dfd1;
}

.profile-photo{
width:100%;
height:420px;
object-fit:cover;
}

.profile-content{
padding:28px;
}

.profile-content h1{
font-family:"Fraunces",serif;
color:#4b0f19;
margin:0;
}

.profile-meta{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:18px;
margin:28px 0;
}

.meta-box{
background:#faf7f1;
padding:16px;
border-radius:14px;
}

.meta-box strong{
display:block;
color:#4b0f19;
margin-bottom:6px;
}

.bio-box{
margin:30px 0;
padding:20px;
background:#faf7f1;
border-radius:14px;
}

.send-interest{
width:100%;
background:#c59b5b;
color:white;
border:none;
padding:16px;
border-radius:12px;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.send-interest:hover{
opacity:.9;
}

.back-link{
display:inline-block;
margin-bottom:20px;
color:#4b0f19;
text-decoration:none;
font-weight:600;
}

</style>

</head>

<body>

<div class="profile-page">

<a href="matches.html" class="back-link">← Back to Matches</a>

<div class="profile-card">

<img id="profilePhoto"
src="https://placehold.co/800x500?text=Profile"
class="profile-photo">

<div class="profile-content">

<h1 id="profileName">Loading...</h1>

<div class="profile-meta">

<div class="meta-box">
<strong>District</strong>
<span id="profileDistrict">-</span>
</div>

<div class="meta-box">
<strong>Education</strong>
<span id="profileEducation">-</span>
</div>

<div class="meta-box">
<strong>Occupation</strong>
<span id="profileOccupation">-</span>
</div>

<div class="meta-box">
<strong>Marital Status</strong>
<span id="profileMarital">-</span>
</div>

<div class="meta-box">
<strong>Height</strong>
<span id="profileHeight">-</span>
</div>

</div>

<div class="bio-box">
<h3>About</h3>
<p id="profileBio">-</p>
</div>

<button class="send-interest" id="interestBtn">
❤️ Send Interest
</button>

</div>

</div>

</div>

<script src="js/profile.js"></script>

</body>
</html>
