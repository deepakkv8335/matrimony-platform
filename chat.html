<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat • WC Matrimony</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<style>
body{
    margin:0;
    background:#f7f2e8;
    font-family:"Work Sans",sans-serif;
}

.chat-container{
    max-width:800px;
    margin:0 auto;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.chat-header{
    background:white;
    padding:18px;
    border-bottom:1px solid #e8dfd1;
}

.chat-header h2{
    margin:0;
    font-family:"Fraunces",serif;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:70%;
    padding:12px 16px;
    border-radius:18px;
}

.sent{
    background:#c59b5b;
    color:white;
    align-self:flex-end;
}

.received{
    background:white;
    border:1px solid #ddd;
    align-self:flex-start;
}

.chat-input{
    display:flex;
    gap:10px;
    padding:18px;
    background:white;
    border-top:1px solid #e8dfd1;
}

.chat-input input{
    flex:1;
    padding:14px;
    border-radius:12px;
    border:1px solid #ddd;
}

.chat-input button{
    background:#c59b5b;
    color:white;
    border:none;
    padding:14px 24px;
    border-radius:12px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="chat-container">

<div class="chat-header">
    <a href="connections.html">← Back</a>
    <h2 id="chatName">Loading...</h2>
</div>

<div id="messages" class="messages"></div>

<form id="chatForm" class="chat-input">
    <input id="messageInput" placeholder="Type a message..." autocomplete="off">
    <button type="submit">Send</button>
</form>

</div>

<script src="js/chat.js"></script>

</body>
</html>
