<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WC Matrimony Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">

<style>
body{
    background:#f7f2e8;
    font-family:"Work Sans",sans-serif;
    margin:0;
}

.admin-header{
    background:#fff;
    border-bottom:1px solid #e6ddcf;
    position:sticky;
    top:0;
}

.admin-header .wrap{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
}

.logo{
    font-family:"Fraunces",serif;
    font-size:28px;
    color:#4b0f19;
    text-decoration:none;
}

.logo span{
    color:#c59b5b;
}

.logout-btn{
    border:1px solid #c59b5b;
    background:white;
    color:#4b0f19;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.admin-main{
    padding:40px 20px;
}

.admin-title{
    color:#4b0f19;
    font-family:"Fraunces",serif;
    margin-bottom:8px;
}

.admin-sub{
    color:#6f6457;
    margin-bottom:30px;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-bottom:35px;
}

.stat-card{
    background:white;
    border-radius:18px;
    padding:22px;
    border:1px solid #e8dfd1;
}

.stat-card h3{
    margin:0;
    font-size:34px;
    color:#4b0f19;
}

.stat-card p{
    margin:8px 0 0;
    color:#7d7368;
}

.section-title{
    color:#4b0f19;
    font-family:"Fraunces",serif;
    margin-bottom:20px;
}

#pendingProfiles{
    display:grid;
    gap:18px;
}

.profile-card{
    background:white;
    border-radius:18px;
    padding:22px;
    border:1px solid #e8dfd1;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.profile-card h3{
    margin:0 0 10px;
    color:#4b0f19;
}

.profile-card p{
    margin:5px 0;
    color:#6f6457;
}

.approve-btn{
    background:#c59b5b;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.approve-btn:hover{
    opacity:.9;
}

.empty-card{
    background:white;
    padding:30px;
    border-radius:18px;
    text-align:center;
    color:#6f6457;
}

.reject-btn{
    background:#9b2c2c;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.reject-btn:hover{
    opacity:.9;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
</head>

<body>

<header class="admin-header">
    <div class="wrap">
        <a class="logo" href="index.html">WC <span>Matrimony</span></a>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</header>

<main class="admin-main">

<div class="wrap">

<h1 class="admin-title">Admin Dashboard</h1>
<p class="admin-sub">Review new member registrations and manage approvals.</p>

<div class="stats-grid">

<div class="stat-card">
<h3 id="pendingCount">0</h3>
<p>Pending</p>
</div>

<div class="stat-card">
<h3 id="approvedCount">0</h3>
<p>Approved</p>
</div>

<div class="stat-card">
<h3 id="totalCount">0</h3>
<p>Total Members</p>
</div>

</div>

<h2 class="section-title">Pending Profiles</h2>

<div id="pendingProfiles"></div>

</div>

</main>

<script src="js/admin.js"></script>

</body>
</html>
